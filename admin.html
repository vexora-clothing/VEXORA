<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VEXORA — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{min-height:100vh;display:grid;place-items:center;padding:25px}
.login-box{width:min(420px,100%);background:#0b0b0b;border:1px solid #222;padding:35px}
.logo{font-size:22px;letter-spacing:.3em;margin-bottom:8px}
.kicker{font-size:9px;color:#666;letter-spacing:.25em;margin-bottom:30px}

label{
display:block;
font-size:9px;
color:#777;
letter-spacing:.15em;
margin-bottom:8px
}

input,textarea,select{
width:100%;
background:#080808;
color:#fff;
border:1px solid #292929;
padding:14px;
outline:none;
margin-bottom:18px
}

textarea{
min-height:100px;
resize:vertical
}

input[type=file]{
padding:12px
}

input[type=file]::file-selector-button{
background:#fff;
color:#000;
border:0;
padding:9px 12px;
margin-right:10px;
font-weight:bold
}

.btn{
width:100%;
padding:15px;
border:1px solid #fff;
background:#fff;
color:#000;
font-weight:bold;
letter-spacing:.15em
}

.error{
color:#ff4b55;
font-size:11px;
margin-top:15px;
line-height:1.5
}

.admin{
min-height:100vh;
padding:25px
}

.header{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #202020;
padding-bottom:20px
}

.brand{
font-size:20px;
letter-spacing:.25em
}

.admin-label{
color:#555;
font-size:8px;
letter-spacing:.25em;
margin-top:6px
}

.logout{
background:#111;
border:1px solid #292929;
color:#fff;
padding:10px 16px;
font-size:8px
}

.container{
max-width:1200px;
margin:40px auto
}

.top{
display:flex;
justify-content:space-between;
align-items:end;
margin-bottom:30px;
gap:20px
}

.title{
font-size:45px;
font-weight:500
}

.sub{
color:#666;
font-size:10px;
margin-top:8px
}

.add-btn{
background:#fff;
color:#000;
border:0;
padding:13px 20px;
font-size:9px;
font-weight:bold;
letter-spacing:.15em
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.card{
background:#0b0b0b;
border:1px solid #1d1d1d;
padding:14px
}

.image{
aspect-ratio:4/5;
background:#111;
display:grid;
place-items:center;
overflow:hidden;
margin-bottom:15px
}

.image img{
width:100%;
height:100%;
object-fit:cover
}

.no-image{
color:#444;
font-size:8px
}

.name{
font-size:13px;
margin-bottom:8px
}

.meta{
color:#777;
font-size:9px;
line-height:1.8
}

.stock{
color:#35df88
}

.actions{
display:flex;
gap:8px;
margin-top:15px
}

.edit,.delete{
flex:1;
padding:11px;
font-size:8px
}

.edit{
background:#fff;
color:#000;
border:0
}

.delete{
background:#111;
color:#ff4b55;
border:1px solid #332020
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:grid;
place-items:center;
padding:20px;
z-index:100
}

.modal-box{
width:min(600px,100%);
max-height:92vh;
overflow:auto;
background:#0b0b0b;
border:1px solid #292929;
padding:25px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px
}

.modal-title{
font-size:22px
}

.close{
width:35px;
height:35px;
background:#111;
border:1px solid #292929;
color:#fff;
font-size:18px
}

.form-buttons{
display:flex;
gap:10px
}

.save,.cancel{
flex:1;
padding:15px
}

.save{
background:#fff;
color:#000;
border:0;
font-weight:bold
}

.cancel{
background:#111;
color:#fff;
border:1px solid #292929
}

.status{
font-size:10px;
color:#777;
margin-top:-8px;
margin-bottom:18px
}

.status.success{
color:#35df88
}

.status.error{
color:#ff4b55
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:-5px 0 18px
}

.thumb{
position:relative;
aspect-ratio:1;
background:#111;
border:1px solid #222;
overflow:hidden
}

.thumb img{
width:100%;
height:100%;
object-fit:cover
}

.num{
position:absolute;
left:4px;
bottom:4px;
background:#000c;
padding:4px 6px;
font-size:8px
}

@media(max-width:800px){

.admin{
padding:18px
}

.top{
flex-direction:column;
align-items:flex-start
}

.add-btn{
width:100%
}

.products{
grid-template-columns:1fr 1fr;
gap:8px
}

.card{
padding:8px
}

.actions{
flex-direction:column
}

.title{
font-size:38px
}

}

@media(max-width:500px){

.gallery{
grid-template-columns:repeat(2,1fr)
}

.modal-box{
padding:18px
}

}
</style>
</head>

<body>

<section class="login" id="loginPage">

<div class="login-box">

<div class="logo">
VEXORA
</div>

<div class="kicker">
ADMIN PANEL / SECURE LOGIN
</div>

<label>EMAIL ADDRESS</label>

<input
id="loginEmail"
type="email"
placeholder="admin@email.com"
>

<label>PASSWORD</label>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button
class="btn"
id="loginBtn"
>
LOGIN
</button>

<div
class="error"
id="loginError"
></div>

</div>

</section>


<section
class="admin hidden"
id="adminPage"
>

<header class="header">

<div>

<div class="brand">
VEXORA
</div>

<div class="admin-label">
ADMIN / PRODUCT MANAGEMENT
</div>

</div>

<button
class="logout"
id="logoutBtn"
>
LOGOUT
</button>

</header>


<div class="container">

<div class="top">

<div>

<h1 class="title">
PRODUCTS
</h1>

<p class="sub">
Add, edit and delete VEXORA products.
</p>

</div>

<button
class="add-btn"
id="addBtn"
>
+ ADD PRODUCT
</button>

</div>


<div
class="products"
id="products"
>
</div>

</div>

</section>


<div
class="modal hidden"
id="modal"
>

<div class="modal-box">

<div class="modal-head">

<h2
class="modal-title"
id="modalTitle"
>
ADD PRODUCT
</h2>

<button
class="close"
id="closeModal"
>
×
</button>

</div>


<label>
PRODUCT NAME
</label>

<input
id="productName"
type="text"
placeholder="VEXORA DESIGN 01"
>


<label>
PRICE
</label>

<input
id="productPrice"
type="number"
min="0"
placeholder="5900"
>


<label>
CATEGORY
</label>

<select
id="productCategory"
>

<option value="tshirts">
T-Shirts
</option>

<option value="pants">
Pants
</option>

<option value="hoodies">
Hoodies
</option>

<option value="accessories">
Accessories
</option>

</select>


<label>
PRODUCT PHOTOS
</label>

<input
id="productImageFiles"
type="file"
accept="image/*"
multiple
>

<div
class="status"
id="uploadStatus"
>
Select 1 or more photos. First photo becomes the main photo.
</div>

<div
class="gallery"
id="gallery"
>
</div>


<label>
DESCRIPTION
</label>

<textarea
id="productDescription"
placeholder="Heavyweight oversized VEXORA T-shirt."
></textarea>


<label>
SIZE S STOCK
</label>

<input
id="stockS"
type="number"
min="0"
value="0"
>


<label>
SIZE M STOCK
</label>

<input
id="stockM"
type="number"
min="0"
value="0"
>


<label>
SIZE L STOCK
</label>

<input
id="stockL"
type="number"
min="0"
value="0"
>


<label>
SIZE XL STOCK
</label>

<input
id="stockXL"
type="number"
min="0"
value="0"
>


<div class="form-buttons">

<button
class="cancel"
id="cancelBtn"
>
CANCEL
</button>

<button
class="save"
id="saveBtn"
>
SAVE PRODUCT
</button>

</div>

<div
class="error"
id="formError"
></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ltmeyfkdzxxvkruclohd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_zPy_-To3Lbx_BXb9GEDUZw__Pz0vNQG";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const BUCKET =
"products-image";

let editingId =
null;

let existingImages =
[];


const $ =
id => document.getElementById(id);


const loginPage =
$("loginPage");

const adminPage =
$("adminPage");

const productsBox =
$("products");

const modal =
$("modal");

const formError =
$("formError");

const status =
$("uploadStatus");

const gallery =
$("gallery");

const nameEl =
$("productName");

const priceEl =
$("productPrice");

const categoryEl =
$("productCategory");

const filesEl =
$("productImageFiles");

const descEl =
$("productDescription");

const sEl =
$("stockS");

const mEl =
$("stockM");

const lEl =
$("stockL");

const xlEl =
$("stockXL");


function esc(v){

return String(v ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


async function isAdmin(id){

const {
data,
error
} =
await client

.from("admin_users")

.select("user_id")

.eq("user_id",id)

.maybeSingle();


if(error){

console.error(error);

return false;

}

return !!data;

}


async function checkUser(){

const {
data:{
session
}
} =
await client.auth.getSession();


if(
session &&
await isAdmin(session.user.id)
){

showAdmin();

}else{

showLogin();

}

}


function showLogin(){

loginPage.classList.remove(
"hidden"
);

adminPage.classList.add(
"hidden"
);

}


function showAdmin(){

loginPage.classList.add(
"hidden"
);

adminPage.classList.remove(
"hidden"
);

loadProducts();

}


$("loginBtn").onclick =
async()=>{

const err =
$("loginError");

err.textContent = "";


const email =
$("loginEmail")
.value
.trim();

const password =
$("loginPassword")
.value;


if(
!email ||
!password
){

err.textContent =
"Please enter email and password.";

return;

}


const b =
$("loginBtn");

b.disabled = true;

b.textContent =
"LOGGING IN...";


const {
data,
error
} =
await client.auth.signInWithPassword({

email,

password

});


if(error){

err.textContent =
error.message;

b.disabled = false;

b.textContent =
"LOGIN";

return;

}


if(
!await isAdmin(
data.user.id
)
){

await client.auth.signOut();

err.textContent =
"This account is not an admin.";

b.disabled = false;

b.textContent =
"LOGIN";

return;

}


showAdmin();

b.disabled = false;

b.textContent =
"LOGIN";

};


$("logoutBtn").onclick =
async()=>{

await client.auth.signOut();

showLogin();

};


async function loadProducts(){

productsBox.innerHTML =
"<p style='color:#555'>Loading products...</p>";


const {
data,
error
} =
await client

.from("products")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(error){

productsBox.innerHTML =
`
<p class="error">
${esc(error.message)}
</p>
`;

return;

}


if(!data?.length){

productsBox.innerHTML =
"<p style='color:#555'>No products found.</p>";

return;

}


productsBox.innerHTML =
data.map(
p=>{

const imgs =
Array.isArray(p.images) &&
p.images.length

? p.images

: (
p.image
? [p.image]
: []
);


const total =
Number(p.stock_s || 0) +
Number(p.stock_m || 0) +
Number(p.stock_l || 0) +
Number(p.stock_xl || 0);


return `

<div class="card">

<div class="image">

${
imgs[0]

?

`
<img
src="${esc(imgs[0])}"
onerror="this.style.display='none'"
>
`

:

`
<span class="no-image">
NO IMAGE
</span>
`
}

</div>


<div class="name">

${esc(
p.name ||
"Unnamed Product"
)}

</div>


<div class="meta">

CATEGORY /
${esc(p.category || "")}

<br>

PRICE /
Rs.
${Number(
p.price || 0
).toLocaleString("en-LK")}

<br>

STOCK /

<span class="stock">
${total}
</span>

<br>

PHOTOS /
${imgs.length}

</div>


<div class="actions">

<button
class="edit"
onclick="editProduct('${esc(p.id)}')"
>
EDIT
</button>

<button
class="delete"
onclick="deleteProduct('${esc(p.id)}')"
>
DELETE
</button>

</div>

</div>

`;

}
).join("");

}


function resetForm(){

editingId =
null;

existingImages =
[];


nameEl.value =
"";

priceEl.value =
"";

categoryEl.value =
"tshirts";

filesEl.value =
"";

descEl.value =
"";

sEl.value =
0;

mEl.value =
0;

lEl.value =
0;

xlEl.value =
0;

gallery.innerHTML =
"";

formError.textContent =
"";

status.textContent =
"Select 1 or more photos. First photo becomes the main photo.";

status.className =
"status";

}


$("addBtn").onclick =
()=>{

resetForm();

$("modalTitle").textContent =
"ADD PRODUCT";

modal.classList.remove(
"hidden"
);

};


filesEl.onchange =
()=>{

gallery.innerHTML =
"";


const fs =
[
...filesEl.files
];


if(!fs.length){

return;

}


if(
fs.length > 10
){

filesEl.value =
"";

status.textContent =
"Maximum 10 photos.";

status.className =
"status error";

return;

}


for(
const f of fs
){

if(
!f.type.startsWith("image/") ||
f.size > 10 * 1024 * 1024
){

filesEl.value =
"";

gallery.innerHTML =
"";

status.textContent =
"Each photo must be an image under 10MB.";

status.className =
"status error";

return;

}


const r =
new FileReader();


r.onload =
e=>{

const d =
document.createElement(
"div"
);

d.className =
"thumb";


d.innerHTML =

`
<img
src="${e.target.result}"
>

<span class="num">
${gallery.children.length + 1}
</span>
`;


gallery.appendChild(d);

};


r.readAsDataURL(f);

}


status.textContent =
`${fs.length} photo(s) selected.`;

status.className =
"status success";

};


async function editProduct(id){

const {
data,
error
} =
await client

.from("products")

.select("*")

.eq("id",id)

.single();


if(error){

alert(error.message);

return;

}


editingId =
id;


existingImages =

Array.isArray(data.images) &&
data.images.length

?

data.images

:

(
data.image
? [data.image]
: []
);


$("modalTitle").textContent =
"EDIT PRODUCT";


nameEl.value =
data.name || "";

priceEl.value =
data.price || "";

categoryEl.value =
data.category || "tshirts";

descEl.value =
data.description || "";

sEl.value =
data.stock_s || 0;

mEl.value =
data.stock_m || 0;

lEl.value =
data.stock_l || 0;

xlEl.value =
data.stock_xl || 0;


filesEl.value =
"";


gallery.innerHTML =
"";


existingImages.forEach(
(u,i)=>{

const d =
document.createElement(
"div"
);

d.className =
"thumb";


d.innerHTML =

`
<img
src="${esc(u)}"
>

<span class="num">
${i + 1}
</span>
`;


gallery.appendChild(d);

}
);


status.textContent =

existingImages.length

?

`Existing gallery: ${existingImages.length} photo(s). Choose new photos to replace it.`

:

"No existing photos.";


status.className =
"status";


formError.textContent =
"";


modal.classList.remove(
"hidden"
);

}


async function uploadOne(file){

const ext =

(
file.name
.split(".")
.pop() ||
"jpg"
)

.toLowerCase()

.replace(
/[^a-z0-9]/g,
""
)

|| "jpg";


const path =

`products/${Date.now()}-${crypto.randomUUID()}.${ext}`;


const {
error
} =

await client

.storage

.from(BUCKET)

.upload(

path,

file,

{

cacheControl:"3600",

upsert:false,

contentType:file.type

}

);


if(error){

throw error;

}


return

client

.storage

.from(BUCKET)

.getPublicUrl(path)

.data

.publicUrl;

}


$("saveBtn").onclick =
async()=>{

formError.textContent =
"";


const name =
nameEl.value.trim();

const price =
Number(priceEl.value);

const s =
Number(sEl.value || 0);

const m =
Number(mEl.value || 0);

const l =
Number(lEl.value || 0);

const xl =
Number(xlEl.value || 0);


const files =
[
...filesEl.files
];


if(!name){

formError.textContent =
"Product name is required.";

return;

}


if(
!Number.isFinite(price) ||
price < 0
){

formError.textContent =
"Enter a valid price.";

return;

}


if(
[s,m,l,xl].some(
x => x < 0
)
){

formError.textContent =
"Stock cannot be negative.";

return;

}


const b =
$("saveBtn");

b.disabled =
true;

b.textContent =
"SAVING...";


try{

let images =
existingImages.slice();


if(files.length){

images = [];


for(
let i=0;
i<files.length;
i++
){

status.textContent =
`Uploading photo ${i + 1} of ${files.length}...`;

status.className =
"status";


images.push(
await uploadOne(
files[i]
)
);

}

}


const payload = {

name:name,

price:price,

category:
categoryEl.value,

description:
descEl.value.trim(),

stock_s:s,

stock_m:m,

stock_l:l,

stock_xl:xl,

images:images,

image:
images[0] || ""

};


let result;


if(editingId){

result =
await client

.from("products")

.update(payload)

.eq(
"id",
editingId
);

}else{

result =
await client

.from("products")

.insert(
payload
);

}


if(result.error){

throw result.error;

}


modal.classList.add(
"hidden"
);

resetForm();

await loadProducts();


}catch(e){

console.error(e);

formError.textContent =
e.message ||
"Upload/save failed.";

}finally{

b.disabled =
false;

b.textContent =
"SAVE PRODUCT";

}

};


async function deleteProduct(id){

if(
!confirm(
"Delete this product permanently?"
)
){

return;

}


const {
error
} =
await client

.from("products")

.delete()

.eq(
"id",
id
);


if(error){

alert(error.message);

return;

}


loadProducts();

}


$("closeModal").onclick =
()=>{

modal.classList.add(
"hidden"
);

};


$("cancelBtn").onclick =
()=>{

modal.classList.add(
"hidden"
);

};


modal.onclick =
e=>{

if(
e.target === modal
){

modal.classList.add(
"hidden"
);

}

};


$("loginPassword").onkeydown =
e=>{

if(
e.key === "Enter"
){

$("loginBtn").click();

}

};


checkUser();

</script>

</body>
</html>
